server:
  port: 8080

spring:
  profiles:
    active: h2 # <--- Aquí defines cuál arranca por defecto ('h2' o 'mysql')

---
# ==========================================
# PERFIL H2 (En memoria)
# ==========================================
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console


---
# ==========================================
# PERFIL MYSQL (Base de datos real)
# ==========================================
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/task_manager_db?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

---
# ==========================================
# PERFIL POSTGRES (Neon PostgreSQL)
# ==========================================
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-mute-snow-a5pqxa80-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_SVwudD7aHR2b}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true